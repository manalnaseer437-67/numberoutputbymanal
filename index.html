<body>
    <h1>WEBSITE FOR BOBA BASH BY MANAL</h1>
    <p>Enter a Number to be displayed</p>
    <textarea id="inputnum" placeholder="..."></textarea>
    <br>
    <button id="submitbutton">Enter</button>
    <br>


    <br>
    <output id="placeholder">Number:</output>
    <script>
        const inputnum= document.getElementById('inputnum')
        const submitbtn=document.getElementById('submitbutton')
        const placeholder=document.getElementById('placeholder')
    
        submitbtn.addEventListener('click', function() {
            const inputValue=inputnum.value;
            placeholder.textContent="Number: "+inputValue;
        });
    </script>
